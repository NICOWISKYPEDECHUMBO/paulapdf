<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programa de Renomear</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script><script src="logic.js" defer></script><script src="app.js" defer></script></head><body>
<main>
<header class="top"><img src="logo.png" alt="WDS Soluções" class="logo"><h1>Programa de Renomear</h1></header>
<section id="drop" class="drop"><span>Arraste os PDFs aqui</span><button id="add" class="primary">＋ Adicionar PDFs</button><input id="files" type="file" accept=".pdf,application/pdf" multiple hidden></section>
<section class="workspace">
<div class="datebar"><label for="date">DATA</label><input id="date" placeholder="Digite a data. Ex.: 10.09.2026 ou 10 de setembro" maxlength="80" autocomplete="off"><input type="date" id="cal" title="Escolher no calendário"><span id="example"></span></div><div class="toolbar"><label><input type="checkbox" id="all"> Selecionar todos</label><span id="selected">0 selecionados</span><span id="summary"></span><div class="actions"><button id="remove">Apagar selecionados</button><button id="clear">Limpar tudo</button><button id="rename" class="primary">Renomear selecionados</button><button id="download">↓ Baixar selecionados</button></div></div>
<div class="table-wrap"><table><thead><tr><th></th><th>ARQUIVO</th><th>NOME DA PESSOA</th><th>NOVO NOME</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty">Nenhum PDF adicionado.</div></div>
</section>
</main>
<div id="notice" role="status" aria-live="polite"></div></body></html>
